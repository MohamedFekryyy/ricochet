<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1d1b">
<title>ricochet</title>
<style>
/* ricochet — industrial pocket-instrument shell.
   Light field-grey body, printed lowercase labels, raised keys,
   a dark led-matrix display. own identity, workshop-grade. */

:root {
  --body: #1e1d1b;          /* dark field grey */
  --body-dark: #141311;
  --ink: #e9e7e1;
  --ink-soft: rgba(233, 231, 225, 0.5);
  --key-top: #343330;
  --key-bot: #272625;
  --key-edge: #100f0e;
  --accent: #ff4d00;        /* signal orange */
  --amber: #ffb000;         /* led amber */
  --screen: #0b0a08;        /* warm black glass */
  --lcd: #14120e;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--body);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  user-select: none; -webkit-user-select: none;
}

body {
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px)
           calc(env(safe-area-inset-right, 0px) + 12px)
           calc(env(safe-area-inset-bottom, 0px) + 12px)
           calc(env(safe-area-inset-left, 0px) + 12px);
  gap: 10px;
}

/* ---------- physical keys ---------- */

.key {
  font: inherit; color: var(--ink); cursor: pointer;
  border: 1px solid var(--key-edge); border-radius: 6px;
  background: linear-gradient(var(--key-top), var(--key-bot));
  box-shadow: 0 2px 0 var(--key-edge), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  text-transform: lowercase; letter-spacing: 0.08em;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.key:active {
  transform: translateY(2px);
  box-shadow: 0 0 0 var(--key-edge), inset 0 1px 2px rgba(0, 0, 0, 0.18);
}

.led {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(233, 231, 225, 0.16);
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.25);
  flex: none;
}
.key.active .led, .key-start .led {
  background: var(--accent);
  box-shadow: 0 0 6px rgba(255, 77, 0, 0.8);
}

/* ---------- top bar ---------- */

#hud {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 2px;
}
#brand { display: flex; flex-direction: column; line-height: 1.15; }
#brand .name { font-size: 15px; letter-spacing: 0.32em; font-weight: 700; }
.hud-buttons { display: flex; gap: 8px; }
.key-sm { width: 40px; height: 34px; font-size: 13px; }
.key-sm.off { color: var(--ink-soft); }
.key-sm.off .led { background: rgba(233, 231, 225, 0.16); box-shadow: none; }

.key-link { width: auto; padding: 0 10px; font-size: 10px; }
.key-link.active { border-color: var(--accent); }
.key-link.beat .led { background: var(--amber); box-shadow: 0 0 8px rgba(255, 176, 0, 0.9); }

/* ---------- display ---------- */

#screen {
  position: relative; flex: 1 1 auto; min-height: 0;
  border-radius: 10px;
  border: 1px solid #3a3835;
  background: var(--screen);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.85), 0 1px 0 rgba(255, 255, 255, 0.07);
  overflow: hidden;
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#link-status {
  font-size: 8px; letter-spacing: 0.18em; text-transform: lowercase;
  color: var(--accent);
  white-space: nowrap;
}

/* ---------- control panel ---------- */

#controls {
  display: flex; flex-direction: column; gap: 9px;
  touch-action: manipulation;
}
.section-label {
  font-size: 8px; letter-spacing: 0.26em; color: var(--ink-soft);
  margin: 0 2px 5px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after {
  content: ""; flex: 1; height: 1px; background: rgba(233, 231, 225, 0.14);
}

#mode-keys { display: flex; gap: 8px; }
.key-mode { flex: 1; height: 38px; font-size: 12px; }
.key-mode.active { border-color: var(--accent); }

.key-row { display: flex; gap: 6px; }
.key-row .key {
  flex: 1; min-width: 0; height: 44px;
  flex-direction: column; gap: 2px; padding: 0 2px;
}
.key-row .key .lbl { font-size: 11px; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; }
.key-row .key.active { border-color: var(--accent); }

/* parameter blocks: printed label, lcd readout, - / + keys */
.params { display: flex; gap: 8px; }
.param { flex: 1; min-width: 0; }
.param .param-label {
  font-size: 8px; letter-spacing: 0.2em; color: var(--ink-soft);
  text-align: center; margin-bottom: 4px; white-space: nowrap; overflow: hidden;
}
.param .param-face { display: flex; gap: 5px; align-items: stretch; }
.param .key { width: 34px; height: 34px; font-size: 15px; flex: none; }
.param .lcd {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--lcd); color: var(--amber);
  border: 1px solid #3a3835; border-radius: 5px;
  box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.8);
  font-size: 15px; letter-spacing: 0.1em;
  text-shadow: 0 0 6px rgba(255, 176, 0, 0.55);
}

/* ---------- landscape phones: display left, controls right ---------- */

@media (orientation: landscape) and (max-height: 540px) {
  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      "hud hud"
      "screen controls";
    gap: 8px 12px;
  }
  #hud { grid-area: hud; }
  #screen { grid-area: screen; }
  #controls {
    grid-area: controls;
    overflow-y: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  #controls::-webkit-scrollbar { display: none; }
  .params { flex-direction: column; gap: 6px; }
  .param .param-label { margin-bottom: 2px; }
  .param .key { width: 32px; height: 30px; font-size: 13px; }
  .param .lcd { font-size: 13px; }
  .key-row { flex-wrap: wrap; }
  .key-row .key { flex: 1 1 28%; height: 38px; }
  #controls { gap: 7px; }
  .key-mode { height: 36px; }
}

/* ---------- power overlay ---------- */

#overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: var(--body); padding: 24px; text-align: center;
}
.plate { display: flex; flex-direction: column; align-items: center; }
#overlay h1 { font-size: 24px; letter-spacing: 0.42em; margin: 0 0 4px; text-indent: 0.42em; }
#overlay .tagline { font-size: 9px; letter-spacing: 0.22em; color: var(--ink-soft); margin: 0 0 26px; }
.key-start {
  height: 46px; padding: 0 34px; font-size: 13px; letter-spacing: 0.24em;
  border-color: var(--accent);
}
#overlay .note { margin-top: 30px; font-size: 9px; line-height: 1.7; letter-spacing: 0.12em; color: var(--ink-soft); }

#smoke {
  position: fixed; left: 0; bottom: 0; z-index: 99; margin: 0;
  max-height: 45%; max-width: 100%; overflow: auto;
  background: #000; color: #4ade80; font-size: 9px; white-space: pre-wrap;
}

</style>
</head>
<body>

<header id="hud" hidden>
  <div id="brand">
    <span class="name">ricochet</span>
    <span id="link-status" role="status" aria-live="polite" hidden></span>
  </div>
  <div class="hud-buttons">
    <button id="btn-link" class="key key-sm key-link" aria-label="Ableton Link sync" title="Ableton Link sync" hidden><span class="led"></span>link</button>
    <button id="btn-pause" class="key key-sm" aria-label="Pause" title="Pause">&#10074;&#10074;</button>
    <button id="btn-mute" class="key key-sm" aria-label="Mute" title="Mute">&#9834;</button>
  </div>
</header>

<main id="screen" hidden>
  <canvas id="stage"></canvas>
</main>

<section id="controls" hidden>
  <div class="section">
    <div id="mode-keys">
      <button class="key key-mode active" data-mode="bounce"><span class="led"></span>bounce</button>
      <button class="key key-mode" data-mode="grid"><span class="led"></span>grid</button>
    </div>
  </div>
  <div id="panel-bounce" class="panel"></div>
  <div id="panel-grid" class="panel" hidden></div>
  <div class="section">
    <div class="section-label">sound</div>
    <div id="sound-keys" class="key-row"></div>
  </div>
  <div class="section">
    <div class="section-label">scale</div>
    <div id="scale-keys" class="key-row"></div>
  </div>
</section>

<div id="overlay">
  <div class="plate">
    <h1>ricochet</h1>
    <p class="tagline">pocket instrument &middot; mk i</p>
    <button id="btn-start" class="key key-start"><span class="led"></span>power</button>
    <p class="note">sound starts after your tap<br>plug audio out into your mixer</p>
  </div>
</div>

<script>

// ---- physics.js ----
// Pure 2D physics: balls bouncing inside a regular convex polygon.
// No DOM, no audio, no globals: safe to unit-test in Node.

function polygonVertices(sides, cx, cy, radius, rotation = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const a = rotation + (i * 2 * Math.PI) / sides;
    pts.push({ x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) });
  }
  return pts;
}

function centroid(vertices) {
  let x = 0, y = 0;
  for (const p of vertices) { x += p.x; y += p.y; }
  return { x: x / vertices.length, y: y / vertices.length };
}

// A polygon with precomputed inward-pointing wall normals.
// edges[i] is the wall from vertices[i] to vertices[(i+1) % sides].
function makePolygon(sides, cx, cy, radius, rotation) {
  const vertices = polygonVertices(sides, cx, cy, radius, rotation);
  const c = centroid(vertices);
  const edges = vertices.map((a, i) => {
    const b = vertices[(i + 1) % vertices.length];
    const ex = b.x - a.x, ey = b.y - a.y;
    let nx = -ey, ny = ex;
    const len = Math.hypot(nx, ny) || 1;
    nx /= len; ny /= len;
    // Flip so the normal points toward the centroid (inward).
    if ((c.x - a.x) * nx + (c.y - a.y) * ny < 0) { nx = -nx; ny = -ny; }
    return { ax: a.x, ay: a.y, nx, ny };
  });
  return { sides, vertices, edges, center: c, radius };
}

// Signed distance from point to a wall line, positive toward the interior.
function wallDistance(edge, x, y) {
  return (x - edge.ax) * edge.nx + (y - edge.ay) * edge.ny;
}

function makeBall(x, y, vx, vy, r) {
  return { x, y, vx, vy, r };
}

function ballSpeed(b) {
  return Math.hypot(b.vx, b.vy);
}

// Set an absolute speed (px/s), preserving direction. A resting ball
// gets pushed along +x; callers that want a direction set one first.
function setBallSpeed(b, speed) {
  const s = ballSpeed(b);
  if (s === 0) { b.vx = speed; b.vy = 0; return b; }
  const k = speed / s;
  b.vx *= k; b.vy *= k;
  return b;
}

// Push a ball back inside the polygon if numeric drift or a shape change
// left it overlapping a wall.
function projectInside(ball, poly) {
  for (let pass = 0; pass < 2; pass++) {
    for (const e of poly.edges) {
      const d = wallDistance(e, ball.x, ball.y);
      if (d < ball.r) {
        ball.x += e.nx * (ball.r - d);
        ball.y += e.ny * (ball.r - d);
      }
    }
  }
  return ball;
}

// Advance one ball by dt seconds. Returns the hit wall index, or null.
// Substeps prevent tunneling at high speed.
function stepBall(ball, poly, dt) {
  const speed = ballSpeed(ball);
  const steps = Math.max(1, Math.ceil((speed * dt) / (ball.r * 0.5)));
  const h = dt / steps;
  let hit = null;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    for (let i = 0; i < poly.edges.length; i++) {
      const e = poly.edges[i];
      const d = wallDistance(e, ball.x, ball.y);
      const outward = ball.vx * e.nx + ball.vy * e.ny < 0;
      if (d < ball.r && outward) {
        const vn = ball.vx * e.nx + ball.vy * e.ny;
        ball.vx -= 2 * vn * e.nx;
        ball.vy -= 2 * vn * e.ny;
        ball.x += e.nx * (ball.r - d);
        ball.y += e.ny * (ball.r - d);
        if (hit === null) hit = i;
      }
    }
  }
  return hit;
}


// ---- notes.js ----
// Pure note/scale mapping: wall index or grid position -> frequency.

const SCALES = {
  pentatonic: [0, 2, 4, 7, 9],
  minor: [0, 3, 5, 7, 10],
  phrygian: [0, 1, 4, 5, 7, 8, 10],
};

const SCALE_NAMES = Object.keys(SCALES);

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

// degree is an index into the scale extended across octaves:
// degree 0 = root, degree scale.length = root one octave up, etc.
function degreeFreq(rootMidi, scaleName, degree) {
  const scale = SCALES[scaleName];
  if (!scale) throw new Error(`unknown scale: ${scaleName}`);
  const oct = Math.floor(degree / scale.length);
  const step = scale[((degree % scale.length) + scale.length) % scale.length];
  return midiToFreq(rootMidi + step + 12 * oct);
}

// Wall i plays degree i, so more corners = a longer climb up the scale.
function wallFreq(rootMidi, scaleName, edgeIndex) {
  return degreeFreq(rootMidi, scaleName, edgeIndex);
}

// Grid: pitch comes from the row only; the top row is the highest note.
function gridFreq(rootMidi, scaleName, row, rows) {
  const degree = Math.max(0, rows - 1 - row);
  return degreeFreq(rootMidi, scaleName, degree + 7); // sit above the bounce register
}


// ---- engine.js ----
// Sequencer engine: owns the polygon, the balls, and the hit events
// that become notes. Pure logic; rendering and audio live elsewhere.



const LIMITS = {
  corners: [3, 12],
  speed: [1, 60],   // px/s ball speed is scaled from this control value
  amount: [1, 3],
};

const SPEED_PX_PER_UNIT = 12;

function clamp(v, [lo, hi]) {
  return Math.min(hi, Math.max(lo, v));
}

function speedToPx(value) {
  return value * SPEED_PX_PER_UNIT;
}

function createBounceState({
  width,
  height,
  sides = 7,
  speed = 23,
  amount = 1,
  scale = 'pentatonic',
  rootMidi = 60,
} = {}) {
  const state = {
    width,
    height,
    sides: clamp(sides, LIMITS.corners),
    speed: clamp(speed, LIMITS.speed),
    scale,
    rootMidi,
    balls: [],
    polygon: null,
    ballRadius: Math.max(6, Math.min(width, height) * 0.018),
  };
  rebuildPolygon(state);
  setAmount(state, amount);
  return state;
}

function rebuildPolygon(state) {
  const cx = state.width / 2;
  const cy = state.height * 0.47;
  const radius = Math.min(state.width, state.height) * 0.4;
  state.polygon = makePolygon(state.sides, cx, cy, radius);
  for (const b of state.balls) projectInside(b, state.polygon);
  return state;
}

function spawnBall(state, angle) {
  const v = speedToPx(state.speed);
  const c = state.polygon.center;
  const ball = makeBall(c.x, c.y, v * Math.cos(angle), v * Math.sin(angle), state.ballRadius);
  state.balls.push(ball);
  return ball;
}

// Advance the simulation; returns hit events [{ edge, freq, ball }].
function bounceStep(state, dt) {
  const events = [];
  for (const ball of state.balls) {
    const edge = stepBall(ball, state.polygon, dt);
    if (edge !== null) {
      events.push({ edge, ball, freq: wallFreq(state.rootMidi, state.scale, edge) });
    }
  }
  return events;
}

function setCorners(state, sides) {
  state.sides = clamp(Math.round(sides), LIMITS.corners);
  rebuildPolygon(state);
  return state;
}

function setSpeed(state, speed) {
  state.speed = clamp(speed, LIMITS.speed);
  for (const b of state.balls) setBallSpeed(b, speedToPx(state.speed));
  return state;
}

function setAmount(state, amount) {
  const target = clamp(Math.round(amount), LIMITS.amount);
  while (state.balls.length < target) {
    spawnBall(state, 0.7 + (state.balls.length * 2 * Math.PI) / Math.max(1, target));
  }
  while (state.balls.length > target) state.balls.pop();
  return state;
}

// Advance the sim by `seconds` in fixed steps, returning every hit with
// its time offset from the start of the window. Used by the background
// scheduler, which books notes ahead of the AudioContext clock while
// the tab is hidden (rAF is paused there, timers still run).
function bounceWindow(state, seconds, step = 1 / 120) {
  const events = [];
  let t = 0;
  while (t < seconds - 1e-9) {
    const dt = Math.min(step, seconds - t);
    for (const ev of bounceStep(state, dt)) {
      events.push({ t: t + dt / 2, edge: ev.edge, freq: ev.freq });
    }
    t += dt;
  }
  return events;
}


// ---- grid.js ----
// Pure touch-grid logic: pointer position -> cells -> gated note triggers.

function cellFromPoint(x, y, width, height, cols, rows) {
  const col = Math.floor((x / width) * cols);
  const row = Math.floor((y / height) * rows);
  if (col < 0 || col >= cols || row < 0 || row >= rows) return null;
  return { col, row };
}

// size is the brush radius in cells: 1 = the touched cell only.
function brushCells(center, size, cols, rows) {
  const reach = Math.max(0, Math.round(size) - 1);
  const cells = [];
  for (let dr = -reach; dr <= reach; dr++) {
    for (let dc = -reach; dc <= reach; dc++) {
      const row = center.row + dr;
      const col = center.col + dc;
      if (row >= 0 && row < rows && col >= 0 && col < cols) cells.push({ col, row });
    }
  }
  return cells;
}

// Gates how freely dragging retriggers notes. sensitivity 0..100 maps to a
// minimum pointer travel (0..48px) from the last triggered point.
function makeTouchTracker(sensitivity = 90) {
  let last = null;
  const minTravel = () => (Math.max(0, Math.min(100, sensitivity)) / 100) * 48;
  return {
    setSensitivity(v) { sensitivity = v; },
    reset() { last = null; },
    // Returns true when a trigger is allowed at (x, y).
    allow(x, y) {
      if (!last) { last = { x, y }; return true; }
      const d = Math.hypot(x - last.x, y - last.y);
      if (d >= minTravel()) { last = { x, y }; return true; }
      return false;
    },
  };
}


// ---- audio.js ----
// Web Audio voices and the master output chain.
// scheduleVoice works with any BaseAudioContext, including
// OfflineAudioContext, which is how the smoke test renders real audio.

const VOICES = ['bell', 'marimba', 'pluck', 'synth', 'chiptune'];

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Karplus-Strong plucked string rendered into a buffer. Pure and
// deterministic (seeded), so Node tests can assert on the samples.
function renderPluck(freq, sampleRate, seconds = 1.2, seed = 7, damp = 0.996) {
  const n = Math.floor(seconds * sampleRate);
  const period = Math.max(2, Math.round(sampleRate / freq));
  const rand = mulberry32(seed);
  const ring = new Float32Array(period);
  for (let i = 0; i < period; i++) ring[i] = rand() * 2 - 1;
  const out = new Float32Array(n);
  let i = 0;
  for (let s = 0; s < n; s++) {
    const cur = ring[i];
    out[s] = cur;
    const next = ring[(i + 1) % period];
    ring[i] = damp * 0.5 * (cur + next);
    i = (i + 1) % period;
  }
  return out;
}

function envGain(ctx, dest, when, peak, attack, decay) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), when + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
  g.connect(dest);
  return g;
}

function osc(ctx, type, freq) {
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.value = freq;
  return o;
}

function scheduleVoice(ctx, dest, name, freq, when = ctx.currentTime, velocity = 1) {
  const v = Math.max(0, Math.min(1, velocity));
  switch (name) {
    case 'bell': {
      // Inharmonic partials, long decay.
      const partials = [[1, 0.5, 3.2], [2.76, 0.28, 1.8], [5.404, 0.12, 0.8]];
      for (const [ratio, amp, decay] of partials) {
        const g = envGain(ctx, dest, when, amp * v, 0.004, decay);
        const o = osc(ctx, 'sine', freq * ratio);
        o.connect(g);
        o.start(when);
        o.stop(when + decay + 0.1);
      }
      return when + 3.3;
    }
    case 'marimba': {
      const g = envGain(ctx, dest, when, 0.6 * v, 0.003, 0.55);
      const o = osc(ctx, 'sine', freq);
      o.connect(g); o.start(when); o.stop(when + 0.7);
      const g2 = envGain(ctx, dest, when, 0.18 * v, 0.003, 0.12);
      const o2 = osc(ctx, 'sine', freq * 4.2);
      o2.connect(g2); o2.start(when); o2.stop(when + 0.25);
      return when + 0.8;
    }
    case 'pluck': {
      const len = 1.2;
      const buf = ctx.createBuffer(1, Math.floor(len * ctx.sampleRate), ctx.sampleRate);
      buf.getChannelData(0).set(renderPluck(freq, ctx.sampleRate, len));
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = 0.9 * v;
      src.connect(g); g.connect(dest);
      src.start(when); src.stop(when + len);
      return when + len;
    }
    case 'synth': {
      const o = osc(ctx, 'sawtooth', freq);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.Q.value = 1;
      f.frequency.setValueAtTime(Math.min(8000, freq * 6), when);
      f.frequency.exponentialRampToValueAtTime(Math.max(120, freq * 1.5), when + 0.6);
      const g = envGain(ctx, dest, when, 0.4 * v, 0.01, 0.85);
      o.connect(f); f.connect(g);
      o.start(when); o.stop(when + 1.0);
      return when + 1.0;
    }
    case 'chiptune': {
      const o = osc(ctx, 'square', freq);
      o.frequency.setValueAtTime(freq, when);
      o.frequency.setValueAtTime(freq * 1.5, when + 0.05);
      o.frequency.setValueAtTime(freq * 2, when + 0.1);
      const g = envGain(ctx, dest, when, 0.25 * v, 0.002, 0.24);
      o.connect(g);
      o.start(when); o.stop(when + 0.32);
      return when + 0.35;
    }
    default:
      throw new Error(`unknown voice: ${name}`);
  }
}

// Live output: voices -> master gain -> limiter-ish compressor -> out.
function createAudio({ volume = 0.6 } = {}) {
  const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!AC) throw new Error('Web Audio is not available in this browser');
  // Ask the OS for a playback audio session so the page can keep
  // sounding while hidden (honored by recent iOS Safari; a no-op
  // elsewhere or where the API is absent).
  if (typeof navigator !== 'undefined' && navigator.audioSession) {
    try { navigator.audioSession.type = 'playback'; } catch { /* older engines */ }
  }
  const ctx = new AC();
  const master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -6;
  comp.knee.value = 6;
  comp.ratio.value = 12;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;
  master.connect(comp);
  comp.connect(ctx.destination);

  let muted = false;
  let vol = Math.max(0, Math.min(1, volume));
  let active = 0;
  master.gain.value = muted ? 0 : vol;

  return {
    ctx,
    destination: master,
    post: comp,
    play(name, freq, velocity = 1) {
      if (ctx.state !== 'running' || muted || active >= 24) return false;
      active += 1;
      setTimeout(() => { active -= 1; }, 1500);
      scheduleVoice(ctx, master, name, freq, ctx.currentTime, velocity);
      return true;
    },
    // Same as play, but at a scheduled AudioContext time (Link
    // quantization). Clamped to now so a stale estimate never throws.
    playAt(name, freq, when, velocity = 1) {
      if (ctx.state !== 'running' || muted || active >= 24) return false;
      active += 1;
      setTimeout(() => { active -= 1; }, 1500);
      scheduleVoice(ctx, master, name, freq, Math.max(when, ctx.currentTime), velocity);
      return true;
    },
    setVolume(v) {
      vol = Math.max(0, Math.min(1, v));
      if (!muted) master.gain.setTargetAtTime(vol, ctx.currentTime, 0.02);
    },
    setMuted(m) {
      muted = !!m;
      master.gain.setTargetAtTime(muted ? 0 : vol, ctx.currentTime, 0.02);
    },
    isMuted: () => muted,
    getVolume: () => vol,
    resume: () => ctx.resume(),
    suspend: () => ctx.suspend(),
  };
}


// ---- link.js ----
// Ableton Link sync client.
// Browsers cannot use Ableton's documented Link integration routes
// (iOS LinkKit / C++ SDK), so ricochet talks to the companion bridge
// (link/bridge.py) over WebSocket. The bridge joins the session and
// relays tempo/beat/phase; this module estimates network delay with
// ping/pong, follows the corrected timeline, and quantizes note
// triggering onto its beat grid.

const GRID_SUBDIVISION = 0.25; // 16th notes in 4/4
const STALE_AFTER_MS = 1500; // ~37 missed broadcasts
const PING_INTERVAL_MS = 1000;

// Smallest grid multiple at or after `beat` (a hit exactly on the grid
// plays immediately).
function nextGridBeat(beat, sub = GRID_SUBDIVISION) {
  return Math.ceil(beat / sub - 1e-9) * sub + 0; // + 0 normalizes -0
}

// Clock-offset estimator: keeps the offset sample with the smallest
// round-trip time over a sliding window (NTP-style; min-RTT is the
// least delayed sample, so its midpoint is the best offset guess).
// Pure, so unit tests can feed it synthetic networks.
class OffsetEstimator {
  constructor(windowSize = 12) {
    this.windowSize = windowSize;
    this.samples = []; // { rtt, offset }
  }

  // sentAt/receivedAt on the client clock (performance.now, ms),
  // serverTs on the server clock (ms).
  addSample(sentAt, serverTs, receivedAt) {
    const rtt = receivedAt - sentAt;
    const offset = serverTs - (sentAt + receivedAt) / 2;
    this.samples.push({ rtt, offset });
    if (this.samples.length > this.windowSize) this.samples.shift();
    return rtt;
  }

  // Estimated serverTime - clientTime, or null before any sample.
  get offset() {
    if (!this.samples.length) return null;
    let best = this.samples[0];
    for (const s of this.samples) if (s.rtt < best.rtt) best = s;
    return best.offset;
  }

  get bestRtt() {
    if (!this.samples.length) return null;
    return Math.min(...this.samples.map((s) => s.rtt));
  }
}

class LinkSync {
  constructor({ onState, onStatus, pingIntervalMs = PING_INTERVAL_MS, staleAfterMs = STALE_AFTER_MS } = {}) {
    this.onState = onState || (() => {});
    this.onStatus = onStatus || (() => {});
    this.pingIntervalMs = pingIntervalMs;
    this.staleAfterMs = staleAfterMs;
    this.ws = null;
    this.state = null; // last { bpm, beat, phase, quantum, peers, playing, ts }
    this.recvPerf = 0;
    this.lastMsgPerf = 0;
    this.estimator = new OffsetEstimator();
    this.isOn = false;
    this.stale = false;
    this._pingTimer = null;
    this._watchdog = null;
  }

  connect(url) {
    this.disconnect();
    const ws = new WebSocket(url);
    this.ws = ws;
    ws.onopen = () => {
      this.isOn = true;
      this.stale = false;
      this.onStatus('on');
      let pings = 0;
      const ping = () => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ t: 'ping', c: performance.now() }));
          pings += 1;
        }
      };
      ping(); // first sample immediately
      this._pingTimer = setInterval(ping, this.pingIntervalMs);
      this._watchdog = setInterval(() => this._checkStale(), 250);
    };
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      const now = performance.now();
      this.lastMsgPerf = now;
      if (msg.t === 'pong' && typeof msg.c === 'number') {
        this.estimator.addSample(msg.c, msg.ts, now);
        return;
      }
      if (msg.t !== 'state') return;
      this.state = msg;
      this.recvPerf = now;
      if (this.stale) {
        this.stale = false;
        this.onStatus('on');
      }
      this.onState(msg);
    };
    ws.onclose = () => this._teardown('off');
    ws.onerror = () => ws.close();
  }

  _teardown(status) {
    this.isOn = false;
    this.stale = false;
    this.state = null;
    clearInterval(this._pingTimer);
    clearInterval(this._watchdog);
    this._pingTimer = null;
    this._watchdog = null;
    this.onStatus(status);
  }

  _checkStale() {
    if (!this.isOn || this.stale) return;
    if (this.lastMsgPerf && performance.now() - this.lastMsgPerf > this.staleAfterMs) {
      this.stale = true;
      this.onStatus('stale');
    }
  }

  disconnect() {
    if (this.ws) {
      this.ws.onclose = null;
      this.ws.close();
      this.ws = null;
    }
    this.isOn = false;
    this.stale = false;
    this.state = null;
    clearInterval(this._pingTimer);
    clearInterval(this._watchdog);
  }

  get bpm() {
    return this.state ? this.state.bpm : 0;
  }

  // Estimated server-clock time for a client-clock instant.
  serverTimeAt(perfNow = performance.now()) {
    const off = this.estimator.offset;
    return off === null ? null : perfNow + off;
  }

  // Continuous Link beat position right now. With an offset estimate,
  // extrapolate on the server clock (corrects one-way lag); before the
  // first pong, fall back to receipt-time anchoring (uncorrected).
  currentBeat(perfNow = performance.now()) {
    if (!this.state) return 0;
    const serverNow = this.serverTimeAt(perfNow);
    if (serverNow !== null) {
      return this.state.beat + ((serverNow - this.state.ts) / 1000) * (this.state.bpm / 60);
    }
    const elapsedBeats = ((perfNow - this.recvPerf) / 1000) * (this.state.bpm / 60);
    return this.state.beat + elapsedBeats;
  }

  // AudioContext time of the next 16th-note boundary, or null when the
  // timeline is stale (callers must fall back to immediate playback).
  quantizedTime(ctx, perfNow = performance.now()) {
    if (this.stale || !this.state) return null;
    const beat = this.currentBeat(perfNow);
    const gridBeat = nextGridBeat(beat);
    const dtBeats = gridBeat - beat;
    return {
      when: ctx.currentTime + (dtBeats * 60) / this.state.bpm,
      beat,
      gridBeat,
    };
  }

  // AudioContext time of the first 16th-note boundary at or after the
  // beat position that corresponds to `when` (itself an AudioContext
  // time). The background scheduler books hits ahead of the clock, so
  // it cannot use quantizedTime (which only quantizes "now").
  quantizeAt(ctx, when, perfNow = performance.now()) {
    if (this.stale || !this.state) return null;
    const beatNow = this.currentBeat(perfNow);
    const beatAt = beatNow + ((when - ctx.currentTime) * this.state.bpm) / 60;
    const gridBeat = nextGridBeat(beatAt);
    return {
      when: ctx.currentTime + ((gridBeat - beatNow) * 60) / this.state.bpm,
      gridBeat,
    };
  }
}

// The bridge exposes /link-info on the same origin it serves the app
// from (gated by the per-run key in the page URL); the hosted Pages
// copy has no such endpoint, so the link key only appears when the app
// is actually reachable through a bridge.
async function probeBridge(timeoutMs = 900) {
  try {
    const key = new URLSearchParams(location.search).get('key');
    const res = await fetch(`/link-info${key ? `?key=${key}` : ''}`, { signal: AbortSignal.timeout(timeoutMs) });
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}

// WebSocket URL for the bridge that served this page, carrying the
// per-run access key from the page URL.
function bridgeWsUrl() {
  const key = new URLSearchParams(location.search).get('key');
  return `ws://${location.host}/ws${key ? `?key=${key}` : ''}`;
}


// ---- main.js ----
// Ricochet: a tiny browser instrument.
// Bounce mode: balls bounce inside a polygon; each wall hit plays a note.
// Grid mode: drag across a 10x10 field of dots to play.
// Sound is made here; plug the device into a mixer (e.g. EP-136 input).






const params = new URLSearchParams(location.search);
const SMOKE = params.has('smoke');
const LINKTEST = params.has('linktest');
const SHOT = params.get('shot'); // 'bounce' | 'grid' for deterministic screenshots

const GRID_COLS = 10;
const GRID_ROWS = 10;
const BALL_COLORS = ['#ffb000', '#fff1d6', '#ff4d00'];
const BG = '#0b0a08';

const canvas = document.getElementById('stage');
const c2d = canvas.getContext('2d');
const hud = document.getElementById('hud');
const controls = document.getElementById('controls');
const overlay = document.getElementById('overlay');

const app = {
  mode: 'bounce',
  sound: 'bell',
  scale: 'pentatonic',
  rootMidi: 60,
  paused: false,
  audio: null,
  bounce: null,
  corners: 7,
  speed: 23,
  amount: 1,
  flashes: new Map(), // edge index -> intensity 0..1
  grid: {
    sensitivity: 90,
    size: 1,
    tracker: makeTouchTracker(90),
    active: new Map(), // "col,row" -> timestamp
    pointerDown: false,
  },
  triggeredInSmoke: 0,
  hitCount: 0,
  silentUntilCtx: 0,
};

let linkSync = null;
const btnLink = document.getElementById('btn-link');

// ---------- layout ----------

function viewSize() {
  return { w: canvas.clientWidth || window.innerWidth, h: canvas.clientHeight || window.innerHeight };
}

function resize() {
  const { w, h } = viewSize();
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!app.bounce) {
    app.bounce = createBounceState({
      width: w, height: h,
      sides: app.corners, speed: app.speed, amount: app.amount,
      scale: app.scale, rootMidi: app.rootMidi,
    });
  } else {
    app.bounce.width = w;
    app.bounce.height = h;
    rebuildPolygon(app.bounce);
  }
}

function gridRect() {
  const { w, h } = viewSize();
  const side = Math.min(w, h * 0.72) * 0.88;
  return { x: (w - side) / 2, y: (h - side) * 0.45, size: side };
}

// ---------- sound ----------

function play(freq, velocity = 1) {
  if (!app.audio) return;
  if (linkSync && linkSync.isOn) {
    const q = linkSync.quantizedTime(app.audio.ctx);
    if (q) {
      if (LINKTEST) (window.__QUANT = window.__QUANT || []).push(q);
      app.audio.playAt(app.sound, freq, q.when, velocity);
      return;
    }
    // stale timeline: fall through to immediate playback
  }
  app.audio.play(app.sound, freq, velocity);
}

// ---------- ableton link ----------

function updateLinkStatus(msg) {
  const el = document.getElementById('link-status');
  if (linkSync && linkSync.isOn && !linkSync.stale && msg) {
    el.hidden = false;
    el.textContent = `link \u00b7 ${msg.bpm.toFixed(1)} bpm \u00b7 ${msg.peers + 1} peer${msg.peers ? 's' : ''}`;
  } else if (linkSync && linkSync.stale) {
    el.hidden = false;
    el.textContent = 'link lost \u00b7 tap link to retry';
  } else {
    el.hidden = true;
    el.textContent = '';
  }
}

function toggleLink() {
  if (linkSync && linkSync.isOn) {
    linkSync.disconnect();
    linkSync = null;
    btnLink.classList.remove('active');
    updateLinkStatus(null);
    return;
  }
  linkSync = new LinkSync({
    onState: updateLinkStatus,
    onStatus: (st) => {
      btnLink.classList.toggle('active', st === 'on');
      if (st === 'stale') updateLinkStatus(null); // shows the link-lost hint
      if (st === 'off') {
        linkSync = null;
        updateLinkStatus(null);
      }
    },
  });
  linkSync.connect(bridgeWsUrl());
}

btnLink.addEventListener('click', toggleLink);

// The link key only exists when the app is served by the bridge
// (the hosted Pages copy cannot reach a LAN websocket from https).
probeBridge().then((info) => { if (info) btnLink.hidden = false; });

// ---------- grid input ----------

function gridTriggerAt(x, y) {
  const g = gridRect();
  const cell = cellFromPoint(x - g.x, y - g.y, g.size, g.size, GRID_COLS, GRID_ROWS);
  if (!cell) return 0;
  const cells = brushCells(cell, app.grid.size, GRID_COLS, GRID_ROWS);
  const now = performance.now();
  let n = 0;
  for (const c of cells) {
    const key = `${c.col},${c.row}`;
    const last = app.grid.active.get(key);
    if (last && now - last < 120) continue; // don't retrigger a still-lit cell
    if (!app.grid.tracker.allow(x, y)) continue;
    const vel = 1 - 0.25 * (Math.abs(c.col - cell.col) + Math.abs(c.row - cell.row));
    play(gridFreq(app.rootMidi, app.scale, c.row, GRID_ROWS), Math.max(0.4, vel));
    app.grid.active.set(key, now);
    n += 1;
  }
  if (SMOKE) app.triggeredInSmoke += n;
  return n;
}

// ---------- controls ----------

function key(label, active, onTap) {
  const b = document.createElement('button');
  b.className = `key${active ? ' active' : ''}`;
  const l = document.createElement('span');
  l.className = 'lbl';
  l.textContent = label;
  b.append(l);
  b.addEventListener('click', () => onTap(b));
  return b;
}

function param(label, get, set, step, lo, hi) {
  const wrap = document.createElement('div');
  wrap.className = 'param';
  const name = document.createElement('div');
  name.className = 'param-label';
  name.textContent = label;
  const face = document.createElement('div');
  face.className = 'param-face';
  const minus = document.createElement('button');
  minus.className = 'key';
  minus.textContent = '−';
  const value = document.createElement('span');
  value.className = 'lcd';
  value.textContent = String(get()).padStart(2, '0');
  const plus = document.createElement('button');
  plus.className = 'key';
  plus.textContent = '+';
  const update = (d) => {
    const v = Math.min(hi, Math.max(lo, get() + d));
    set(v);
    value.textContent = String(get()).padStart(2, '0');
  };
  minus.addEventListener('click', () => update(-step));
  plus.addEventListener('click', () => update(step));
  face.append(minus, value, plus);
  wrap.append(name, face);
  return wrap;
}

function buildControls() {
  const soundRow = document.getElementById('sound-keys');
  const soundButtons = new Map();
  VOICES.forEach((v) => {
    const b = key(v, v === app.sound, () => {
      app.sound = v;
      for (const [name, btn] of soundButtons) btn.classList.toggle('active', name === v);
      if (app.audio) play(660); // audition the voice
    });
    soundButtons.set(v, b);
    soundRow.append(b);
  });

  const scaleRow = document.getElementById('scale-keys');
  const scaleButtons = new Map();
  SCALE_NAMES.forEach((s) => {
    const b = key(s, s === app.scale, () => {
      app.scale = s;
      app.bounce.scale = s;
      for (const [name, btn] of scaleButtons) btn.classList.toggle('active', name === s);
    });
    scaleButtons.set(s, b);
    scaleRow.append(b);
  });

  const bouncePanel = document.getElementById('panel-bounce');
  const bounceParams = document.createElement('div');
  bounceParams.className = 'params';
  bounceParams.append(
    param('corners', () => app.corners, (v) => { app.corners = v; setCorners(app.bounce, v); }, 1, ...LIMITS.corners),
    param('speed', () => app.speed, (v) => { app.speed = v; setSpeed(app.bounce, v); }, 1, ...LIMITS.speed),
    param('amount', () => app.amount, (v) => { app.amount = v; setAmount(app.bounce, v); }, 1, ...LIMITS.amount),
  );
  bouncePanel.append(bounceParams);

  const gridPanel = document.getElementById('panel-grid');
  const gridParams = document.createElement('div');
  gridParams.className = 'params';
  gridParams.append(
    param('sensitivity', () => app.grid.sensitivity,
      (v) => { app.grid.sensitivity = v; app.grid.tracker.setSensitivity(v); }, 5, 0, 100),
    param('brush', () => app.grid.size, (v) => { app.grid.size = v; }, 1, 1, 3),
  );
  gridPanel.append(gridParams);
}

function switchMode(mode) {
  app.mode = mode;
  document.querySelectorAll('.key-mode').forEach((d) => {
    d.classList.toggle('active', d.dataset.mode === mode);
  });
  document.getElementById('panel-bounce').hidden = mode !== 'bounce';
  document.getElementById('panel-grid').hidden = mode !== 'grid';
}

// ---------- rendering ----------

let lastT = 0;
window.__frames = 0;

function frame(t) {
  window.__frames += 1;
  const dt = Math.min(1 / 30, lastT ? (t - lastT) / 1000 : 1 / 60);
  lastT = t;
  const { w, h } = viewSize();
  c2d.fillStyle = BG;
  c2d.fillRect(0, 0, w, h);

  if (linkSync && linkSync.isOn && !linkSync.stale && linkSync.state) {
    const beatInt = Math.floor(linkSync.currentBeat());
    if (beatInt !== window.__lastBeatInt) {
      window.__lastBeatInt = beatInt;
      btnLink.classList.add('beat');
      setTimeout(() => btnLink.classList.remove('beat'), 110);
    }
  }

  if (app.mode === 'bounce') {
    if (!app.paused && !document.hidden) {
      // Hits already booked by the background scheduler (up to
      // silentUntilCtx) must not be replayed as the sim re-lives them.
      const silent = app.audio && app.audio.ctx.currentTime < (app.silentUntilCtx || 0);
      for (const ev of bounceStep(app.bounce, dt)) {
        if (silent) continue;
        app.flashes.set(ev.edge, 1);
        app.hitCount += 1;
        play(ev.freq, 0.9);
      }
    }
    drawBounce(dt);
  } else {
    drawGrid(t);
  }
  requestAnimationFrame(frame);
}

function drawBounce(dt) {
  const { polygon, balls } = app.bounce;
  const { vertices, edges } = polygon;

  c2d.lineWidth = 1.5;
  for (let i = 0; i < vertices.length; i++) {
    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];
    const f = app.flashes.get(i) || 0;
    c2d.strokeStyle = f > 0.02
      ? `rgba(255, 77, 0, ${0.25 + 0.75 * f})`
      : 'rgba(255, 241, 214, 0.75)';
    c2d.lineWidth = f > 0.02 ? 2.5 : 1.5;
    c2d.beginPath();
    c2d.moveTo(a.x, a.y);
    c2d.lineTo(b.x, b.y);
    c2d.stroke();
    if (f > 0) app.flashes.set(i, f * Math.exp(-dt * 5));
  }

  balls.forEach((ball, i) => {
    c2d.beginPath();
    c2d.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    c2d.fillStyle = BALL_COLORS[i % BALL_COLORS.length];
    c2d.shadowColor = BALL_COLORS[i % BALL_COLORS.length];
    c2d.shadowBlur = 14;
    c2d.fill();
    c2d.shadowBlur = 0;
  });
}

function drawGrid(now) {
  const g = gridRect();
  const cell = g.size / GRID_COLS;
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const cx = g.x + (col + 0.5) * cell;
      const cy = g.y + (row + 0.5) * cell;
      const key = `${col},${row}`;
      const t = app.grid.active.get(key);
      const age = t ? (now - t) / 600 : Infinity;
      if (age < 1) {
        const k = 1 - age;
        c2d.beginPath();
        c2d.arc(cx, cy, cell * 0.16 + cell * 0.22 * k, 0, Math.PI * 2);
        c2d.fillStyle = `rgba(255, 77, 0, ${0.25 + 0.75 * k})`;
        c2d.fill();
      } else {
        if (t) app.grid.active.delete(key);
        c2d.beginPath();
        c2d.arc(cx, cy, 2.2, 0, Math.PI * 2);
        c2d.fillStyle = 'rgba(255, 176, 0, 0.28)';
        c2d.fill();
      }
    }
  }
}

// ---------- input ----------

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let swipeStart = null;

canvas.addEventListener('pointerdown', (e) => {
  if (!app.audio) return;
  app.audio.resume(); // iOS may have suspended the context
  const p = canvasPoint(e);
  if (app.mode === 'grid') {
    app.grid.pointerDown = true;
    app.grid.tracker.reset();
    gridTriggerAt(p.x, p.y);
  } else {
    swipeStart = p;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (app.mode === 'grid' && app.grid.pointerDown) {
    const p = canvasPoint(e);
    gridTriggerAt(p.x, p.y);
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (app.mode === 'grid') {
    app.grid.pointerDown = false;
    app.grid.tracker.reset();
    return;
  }
  if (swipeStart) {
    const p = canvasPoint(e);
    if (Math.abs(p.x - swipeStart.x) > 70) switchMode(p.x < swipeStart.x ? 'grid' : 'bounce');
    swipeStart = null;
  }
});

document.getElementById('btn-pause').addEventListener('click', (e) => {
  app.paused = !app.paused;
  e.currentTarget.innerHTML = app.paused ? '&#9654;' : '&#10074;&#10074;';
  e.currentTarget.classList.toggle('off', app.paused);
});

document.getElementById('btn-mute').addEventListener('click', (e) => {
  if (!app.audio) return;
  app.audio.setMuted(!app.audio.isMuted());
  e.currentTarget.classList.toggle('off', app.audio.isMuted());
});

document.querySelectorAll('.key-mode').forEach((d) => {
  d.addEventListener('click', () => switchMode(d.dataset.mode));
});

// ---------- background playback ----------
// Hidden tabs get no rAF frames, so the visible loop cannot produce
// notes there. While hidden, a timer keeps stepping the bounce sim and
// books hits ahead of the AudioContext clock (Chrome clamps hidden-tab
// timers to ~1/s, so the lookahead must clear a second with margin).
// Flashes are a rendering concern and are skipped here; on return the
// rAF loop picks the sim up exactly where the scheduler left it.

const BG_LOOKAHEAD_S = 1.5;
const BG_TICK_MS = 250;
let bg = null; // { timer, anchorCtx, scheduled }

window.__BG = { ticks: 0, booked: 0, lastWhen: 0, lookahead: BG_LOOKAHEAD_S };

function scheduleNoteAt(freq, velocity, whenCtx) {
  if (!app.audio) return;
  window.__BG.booked += 1;
  window.__BG.lastWhen = whenCtx;
  if (linkSync && linkSync.isOn) {
    const q = linkSync.quantizeAt(app.audio.ctx, whenCtx);
    if (q) {
      app.audio.playAt(app.sound, freq, q.when, velocity);
      return;
    }
  }
  app.audio.playAt(app.sound, freq, whenCtx, velocity);
}

function bgTick() {
  if (!bg || !app.audio) return;
  const ctx = app.audio.ctx;
  if (ctx.state !== 'running') return;
  window.__BG.ticks += 1;
  const target = (ctx.currentTime - bg.anchorCtx) + BG_LOOKAHEAD_S;
  const span = target - bg.scheduled;
  if (span <= 0) return;
  for (const ev of bounceWindow(app.bounce, span)) {
    const when = bg.anchorCtx + bg.scheduled + ev.t;
    if (when < ctx.currentTime - 0.05) continue; // timer stalled; skip the gap
    app.hitCount += 1;
    scheduleNoteAt(ev.freq, 0.9, when);
  }
  bg.scheduled = target;
}

function startBackground() {
  if (bg || !app.audio || app.paused || app.mode !== 'bounce') return;
  if (app.audio.ctx.state !== 'running') return;
  bg = {
    anchorCtx: app.audio.ctx.currentTime + 0.1,
    hiddenAtCtx: app.audio.ctx.currentTime,
    scheduled: 0,
    snapshot: app.bounce.balls.map((b) => ({ ...b })),
  };
  bg.timer = setInterval(bgTick, BG_TICK_MS);
  bgTick();
}

function stopBackground() {
  if (!bg) return;
  clearInterval(bg.timer);
  if (app.audio) {
    const ctx = app.audio.ctx;
    // The scheduler stepped the shared sim up to a lookahead into the
    // future and booked those notes. Rewind to the pre-hidden snapshot
    // and silently re-step the elapsed stretch (its notes are already
    // booked), so ball visuals and sound stay glued together.
    app.bounce.balls.forEach((b, i) => Object.assign(b, bg.snapshot[i] || b));
    const elapsed = Math.max(0, ctx.currentTime - bg.hiddenAtCtx);
    if (elapsed > 0) bounceWindow(app.bounce, elapsed);
    app.silentUntilCtx = bg.anchorCtx + bg.scheduled;
  }
  bg = null;
}

document.addEventListener('visibilitychange', () => {
  if (!app.audio) return;
  if (document.hidden) startBackground();
  else {
    stopBackground();
    app.audio.resume(); // best effort; iOS may have interrupted the context
  }
});

// ---------- startup ----------

function showUI() {
  overlay.hidden = true;
  hud.hidden = false;
  document.getElementById('screen').hidden = false;
  controls.hidden = false;
  // the canvas was laid out while its screen frame was still hidden
  // (client size 0), so re-measure now that it's visible.
  requestAnimationFrame(resize);
}

function start(withAudio) {
  if (withAudio && !app.audio) {
    app.audio = createAudio({ volume: 0.6 });
    app.audio.resume();
  }
  showUI();
}

document.getElementById('btn-start').addEventListener('click', () => start(true));

window.__RIC = app;
window.__LINKCTL = { get: () => linkSync, toggle: toggleLink };
resize();
buildControls();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);

// ---------- headless hooks (used by scripts/smoke.mjs and shots) ----------

if (SHOT) {
  start(false); // visuals only, no audio context
  if (SHOT === 'grid') {
    switchMode('grid');
    app.grid.sensitivity = 0;
    app.grid.tracker.setSensitivity(0);
    // Trace a deterministic stroke repeatedly so any capture moment
    // shows freshly lit cells (they fade after 600ms).
    const stroke = () => {
      const g = gridRect();
      for (let i = 0; i < 7; i++) {
        gridTriggerAt(g.x + (2 + i) * (g.size / GRID_COLS), g.y + (3 + i) * (g.size / GRID_ROWS));
      }
      gridTriggerAt(g.x + 5 * (g.size / GRID_COLS), g.y + 2 * (g.size / GRID_ROWS));
    };
    stroke();
    setInterval(stroke, 400);
  }
}

async function runSmoke() {
  const results = [];
  const ok = (name, cond, detail = '') => results.push({ name, pass: !!cond, detail });
  try {
    // 1. Engine: 10 simulated seconds with 3 balls must produce clean hits.
    const sim = createBounceState({ width: 390, height: 700, sides: 7, speed: 23, amount: 3 });
    let hits = 0;
    let freqOk = true;
    for (let i = 0; i < 600; i++) {
      for (const ev of bounceStep(sim, 1 / 60)) {
        hits += 1;
        if (!Number.isFinite(ev.freq) || ev.freq <= 0) freqOk = false;
      }
    }
    ok('bounce engine produces wall hits', hits > 10, `${hits} hits in 10 simulated s`);
    ok('hit frequencies are finite and positive', freqOk);

    // 2. Real start: audio context, safe defaults, mute behavior.
    start(true);
    await app.audio.resume();
    ok('audio context running after start', app.audio.ctx.state === 'running', app.audio.ctx.state);
    ok('default master volume is safe', app.audio.getVolume() <= 0.85, `volume ${app.audio.getVolume()}`);
    app.audio.setMuted(true);
    ok('mute blocks notes', app.audio.play('bell', 440) === false);
    app.audio.setMuted(false);
    ok('unmute allows notes', app.audio.play('bell', 440) === true);

    // 3. Voices: play each through the live chain and measure real output
    //    on an analyser tap (headless Chrome renders to a null sink; the
    //    analyser still sees the signal).
    const analyser = app.audio.ctx.createAnalyser();
    analyser.fftSize = 2048;
    app.audio.post.connect(analyser); // measure after the limiter
    const buf = new Float32Array(analyser.fftSize);
    const currentPeak = () => {
      analyser.getFloatTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
      return peak;
    };
    const waitQuiet = async () => {
      for (let k = 0; k < 150; k++) {
        await new Promise((r) => setTimeout(r, 60));
        if (currentPeak() < 0.02) return;
      }
    };
    const measurePeak = async (ms) => {
      let peak = 0;
      for (let t = 0; t < ms; t += 30) {
        await new Promise((r) => setTimeout(r, 30));
        peak = Math.max(peak, currentPeak());
      }
      return peak;
    };
    for (const v of VOICES) {
      await waitQuiet(); // let the previous voice decay so peaks stay comparable
      app.sound = v;
      play(440, 1);
      const peak = await measurePeak(500);
      ok(`voice "${v}" produces audible, limited output`, peak > 0.005 && peak <= 1.3, `peak ${peak.toFixed(3)}`);
    }
    app.sound = 'bell';

    // 4. Grid: synthetic pointer drag must trigger notes.
    switchMode('grid');
    const r = canvas.getBoundingClientRect();
    const fire = (type, fx, fy) => canvas.dispatchEvent(new PointerEvent(type, {
      clientX: r.left + r.width * fx, clientY: r.top + r.height * fy, bubbles: true,
    }));
    fire('pointerdown', 0.2, 0.25);
    for (let i = 1; i <= 20; i++) fire('pointermove', 0.2 + i * 0.03, 0.25 + i * 0.02);
    fire('pointerup', 0.8, 0.65);
    ok('grid drag triggers notes', app.triggeredInSmoke > 0, `${app.triggeredInSmoke} notes`);

    // 5. Bounce: the live loop must keep producing wall hits.
    switchMode('bounce');
    const frames = (n) => new Promise((res) => {
      let left = n;
      const tick = () => (--left <= 0 ? res() : requestAnimationFrame(tick));
      requestAnimationFrame(tick);
    });
    const before = app.hitCount;
    await frames(150); // 2.5s of animation frames, independent of wall clock
    ok('live bounce loop keeps playing', app.hitCount > before, `${app.hitCount - before} hits`);
  } catch (err) {
    results.push({ name: 'smoke run completed', pass: false, detail: String((err && err.stack) || err) });
  }
  const pass = results.every((x) => x.pass);
  const pre = document.createElement('pre');
  pre.id = 'smoke';
  pre.textContent = JSON.stringify({ pass, results }, null, 2);
  document.body.appendChild(pre);
  document.title = pass ? 'SMOKE PASS' : 'SMOKE FAIL';
  window.__SMOKE = { pass, results };
}

if (SMOKE) runSmoke();


</script>
