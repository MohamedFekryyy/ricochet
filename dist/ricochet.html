<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Ricochet</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #050505; color: #f2f2f2;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  user-select: none; -webkit-user-select: none;
}
#stage { position: fixed; inset: 0; touch-action: none; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
  pointer-events: none;
}
#brand { font-size: 12px; letter-spacing: 0.4em; opacity: 0.65; }
.hud-buttons { display: flex; gap: 10px; pointer-events: auto; }
.hud-buttons button {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid #333; background: rgba(18, 18, 18, 0.65);
  color: #f2f2f2; font: inherit; font-size: 15px; cursor: pointer;
}
.hud-buttons button.off { opacity: 0.45; }

#controls {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: linear-gradient(transparent, rgba(5, 5, 5, 0.94) 32%);
  touch-action: none;
}
#mode-dots { display: flex; gap: 10px; justify-content: center; padding: 2px 0 10px; }
#mode-dots .dot {
  width: 8px; height: 8px; border-radius: 50%; border: 1px solid #555;
  background: transparent; padding: 0; cursor: pointer;
}
#mode-dots .dot.active { background: #f2f2f2; border-color: #f2f2f2; }

.row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.pill {
  padding: 8px 12px; border: 1px solid #333; border-radius: 999px;
  background: transparent; color: #cfcfcf; font: inherit; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
}
.pill.active { border-color: #ff3b30; color: #fff; background: rgba(255, 59, 48, 0.14); }

.steppers { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.stepper {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid #2a2a2a; border-radius: 12px; padding: 6px 10px;
}
.stepper .label { font-size: 9px; letter-spacing: 0.18em; opacity: 0.55; text-transform: uppercase; }
.stepper .value { min-width: 2.2ch; text-align: center; font-size: 15px; letter-spacing: 0.1em; }
.stepper button {
  width: 26px; height: 26px; border-radius: 8px; border: 1px solid #333;
  background: #111; color: #f2f2f2; font: inherit; font-size: 14px; cursor: pointer;
}

#overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #050505; text-align: center; padding: 24px;
}
#overlay h1 { font-size: 22px; letter-spacing: 0.5em; margin: 0 0 8px; text-indent: 0.5em; }
#overlay .tagline { font-size: 11px; opacity: 0.55; letter-spacing: 0.1em; margin: 0 0 36px; }
#btn-start {
  padding: 16px 34px; border-radius: 999px; border: 1px solid #ff3b30;
  background: rgba(255, 59, 48, 0.12); color: #fff; font: inherit;
  font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
}
#overlay .note { margin-top: 30px; font-size: 10px; opacity: 0.4; letter-spacing: 0.08em; }

#smoke {
  position: fixed; left: 0; bottom: 0; z-index: 99; margin: 0;
  max-height: 45%; max-width: 100%; overflow: auto;
  background: #000; color: #4ade80; font-size: 9px; white-space: pre-wrap;
}

</style>
</head>
<body>
<canvas id="stage"></canvas>

<header id="hud" hidden>
  <div id="brand">RICOCHET</div>
  <div class="hud-buttons">
    <button id="btn-pause" aria-label="Pause" title="Pause">&#10074;&#10074;</button>
    <button id="btn-mute" aria-label="Mute" title="Mute">&#9834;</button>
  </div>
</header>

<section id="controls" hidden>
  <div id="mode-dots">
    <button class="dot active" data-mode="bounce" aria-label="Bounce mode"></button>
    <button class="dot" data-mode="grid" aria-label="Grid mode"></button>
  </div>
  <div id="shared-rows"></div>
  <div id="panel-bounce" class="panel"></div>
  <div id="panel-grid" class="panel" hidden></div>
</section>

<div id="overlay">
  <h1>RICOCHET</h1>
  <p class="tagline">a tiny instrument for happy accidents</p>
  <button id="btn-start">tap to play</button>
  <p class="note">sound starts after your tap &middot; plug into your mixer</p>
</div>

<script>

// ---- physics.js ----
// Pure 2D physics: balls bouncing inside a regular convex polygon.
// No DOM, no audio, no globals: safe to unit-test in Node.

function polygonVertices(sides, cx, cy, radius, rotation = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < sides; i++) {
    const a = rotation + (i * 2 * Math.PI) / sides;
    pts.push({ x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) });
  }
  return pts;
}

function centroid(vertices) {
  let x = 0, y = 0;
  for (const p of vertices) { x += p.x; y += p.y; }
  return { x: x / vertices.length, y: y / vertices.length };
}

// A polygon with precomputed inward-pointing wall normals.
// edges[i] is the wall from vertices[i] to vertices[(i+1) % sides].
function makePolygon(sides, cx, cy, radius, rotation) {
  const vertices = polygonVertices(sides, cx, cy, radius, rotation);
  const c = centroid(vertices);
  const edges = vertices.map((a, i) => {
    const b = vertices[(i + 1) % vertices.length];
    const ex = b.x - a.x, ey = b.y - a.y;
    let nx = -ey, ny = ex;
    const len = Math.hypot(nx, ny) || 1;
    nx /= len; ny /= len;
    // Flip so the normal points toward the centroid (inward).
    if ((c.x - a.x) * nx + (c.y - a.y) * ny < 0) { nx = -nx; ny = -ny; }
    return { ax: a.x, ay: a.y, nx, ny };
  });
  return { sides, vertices, edges, center: c, radius };
}

// Signed distance from point to a wall line, positive toward the interior.
function wallDistance(edge, x, y) {
  return (x - edge.ax) * edge.nx + (y - edge.ay) * edge.ny;
}

function makeBall(x, y, vx, vy, r) {
  return { x, y, vx, vy, r };
}

function ballSpeed(b) {
  return Math.hypot(b.vx, b.vy);
}

// Set an absolute speed (px/s), preserving direction. A resting ball
// gets pushed along +x; callers that want a direction set one first.
function setBallSpeed(b, speed) {
  const s = ballSpeed(b);
  if (s === 0) { b.vx = speed; b.vy = 0; return b; }
  const k = speed / s;
  b.vx *= k; b.vy *= k;
  return b;
}

// Push a ball back inside the polygon if numeric drift or a shape change
// left it overlapping a wall.
function projectInside(ball, poly) {
  for (let pass = 0; pass < 2; pass++) {
    for (const e of poly.edges) {
      const d = wallDistance(e, ball.x, ball.y);
      if (d < ball.r) {
        ball.x += e.nx * (ball.r - d);
        ball.y += e.ny * (ball.r - d);
      }
    }
  }
  return ball;
}

// Advance one ball by dt seconds. Returns the hit wall index, or null.
// Substeps prevent tunneling at high speed.
function stepBall(ball, poly, dt) {
  const speed = ballSpeed(ball);
  const steps = Math.max(1, Math.ceil((speed * dt) / (ball.r * 0.5)));
  const h = dt / steps;
  let hit = null;
  for (let s = 0; s < steps; s++) {
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    for (let i = 0; i < poly.edges.length; i++) {
      const e = poly.edges[i];
      const d = wallDistance(e, ball.x, ball.y);
      const outward = ball.vx * e.nx + ball.vy * e.ny < 0;
      if (d < ball.r && outward) {
        const vn = ball.vx * e.nx + ball.vy * e.ny;
        ball.vx -= 2 * vn * e.nx;
        ball.vy -= 2 * vn * e.ny;
        ball.x += e.nx * (ball.r - d);
        ball.y += e.ny * (ball.r - d);
        if (hit === null) hit = i;
      }
    }
  }
  return hit;
}


// ---- notes.js ----
// Pure note/scale mapping: wall index or grid position -> frequency.

const SCALES = {
  pentatonic: [0, 2, 4, 7, 9],
  minor: [0, 3, 5, 7, 10],
  phrygian: [0, 1, 4, 5, 7, 8, 10],
};

const SCALE_NAMES = Object.keys(SCALES);

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

// degree is an index into the scale extended across octaves:
// degree 0 = root, degree scale.length = root one octave up, etc.
function degreeFreq(rootMidi, scaleName, degree) {
  const scale = SCALES[scaleName];
  if (!scale) throw new Error(`unknown scale: ${scaleName}`);
  const oct = Math.floor(degree / scale.length);
  const step = scale[((degree % scale.length) + scale.length) % scale.length];
  return midiToFreq(rootMidi + step + 12 * oct);
}

// Wall i plays degree i, so more corners = a longer climb up the scale.
function wallFreq(rootMidi, scaleName, edgeIndex) {
  return degreeFreq(rootMidi, scaleName, edgeIndex);
}

// Grid: pitch comes from the row only; the top row is the highest note.
function gridFreq(rootMidi, scaleName, row, rows) {
  const degree = Math.max(0, rows - 1 - row);
  return degreeFreq(rootMidi, scaleName, degree + 7); // sit above the bounce register
}


// ---- engine.js ----
// Sequencer engine: owns the polygon, the balls, and the hit events
// that become notes. Pure logic; rendering and audio live elsewhere.



const LIMITS = {
  corners: [3, 12],
  speed: [1, 60],   // px/s ball speed is scaled from this control value
  amount: [1, 3],
};

const SPEED_PX_PER_UNIT = 12;

function clamp(v, [lo, hi]) {
  return Math.min(hi, Math.max(lo, v));
}

function speedToPx(value) {
  return value * SPEED_PX_PER_UNIT;
}

function createBounceState({
  width,
  height,
  sides = 7,
  speed = 23,
  amount = 1,
  scale = 'pentatonic',
  rootMidi = 60,
} = {}) {
  const state = {
    width,
    height,
    sides: clamp(sides, LIMITS.corners),
    speed: clamp(speed, LIMITS.speed),
    scale,
    rootMidi,
    balls: [],
    polygon: null,
    ballRadius: Math.max(6, Math.min(width, height) * 0.018),
  };
  rebuildPolygon(state);
  setAmount(state, amount);
  return state;
}

function rebuildPolygon(state) {
  const cx = state.width / 2;
  const cy = state.height * 0.42;
  const radius = Math.min(state.width, state.height) * 0.36;
  state.polygon = makePolygon(state.sides, cx, cy, radius);
  for (const b of state.balls) projectInside(b, state.polygon);
  return state;
}

function spawnBall(state, angle) {
  const v = speedToPx(state.speed);
  const c = state.polygon.center;
  const ball = makeBall(c.x, c.y, v * Math.cos(angle), v * Math.sin(angle), state.ballRadius);
  state.balls.push(ball);
  return ball;
}

// Advance the simulation; returns hit events [{ edge, freq, ball }].
function bounceStep(state, dt) {
  const events = [];
  for (const ball of state.balls) {
    const edge = stepBall(ball, state.polygon, dt);
    if (edge !== null) {
      events.push({ edge, ball, freq: wallFreq(state.rootMidi, state.scale, edge) });
    }
  }
  return events;
}

function setCorners(state, sides) {
  state.sides = clamp(Math.round(sides), LIMITS.corners);
  rebuildPolygon(state);
  return state;
}

function setSpeed(state, speed) {
  state.speed = clamp(speed, LIMITS.speed);
  for (const b of state.balls) setBallSpeed(b, speedToPx(state.speed));
  return state;
}

function setAmount(state, amount) {
  const target = clamp(Math.round(amount), LIMITS.amount);
  while (state.balls.length < target) {
    spawnBall(state, 0.7 + (state.balls.length * 2 * Math.PI) / Math.max(1, target));
  }
  while (state.balls.length > target) state.balls.pop();
  return state;
}


// ---- grid.js ----
// Pure touch-grid logic: pointer position -> cells -> gated note triggers.

function cellFromPoint(x, y, width, height, cols, rows) {
  const col = Math.floor((x / width) * cols);
  const row = Math.floor((y / height) * rows);
  if (col < 0 || col >= cols || row < 0 || row >= rows) return null;
  return { col, row };
}

// size is the brush radius in cells: 1 = the touched cell only.
function brushCells(center, size, cols, rows) {
  const reach = Math.max(0, Math.round(size) - 1);
  const cells = [];
  for (let dr = -reach; dr <= reach; dr++) {
    for (let dc = -reach; dc <= reach; dc++) {
      const row = center.row + dr;
      const col = center.col + dc;
      if (row >= 0 && row < rows && col >= 0 && col < cols) cells.push({ col, row });
    }
  }
  return cells;
}

// Gates how freely dragging retriggers notes. sensitivity 0..100 maps to a
// minimum pointer travel (0..48px) from the last triggered point.
function makeTouchTracker(sensitivity = 90) {
  let last = null;
  const minTravel = () => (Math.max(0, Math.min(100, sensitivity)) / 100) * 48;
  return {
    setSensitivity(v) { sensitivity = v; },
    reset() { last = null; },
    // Returns true when a trigger is allowed at (x, y).
    allow(x, y) {
      if (!last) { last = { x, y }; return true; }
      const d = Math.hypot(x - last.x, y - last.y);
      if (d >= minTravel()) { last = { x, y }; return true; }
      return false;
    },
  };
}


// ---- audio.js ----
// Web Audio voices and the master output chain.
// scheduleVoice works with any BaseAudioContext, including
// OfflineAudioContext, which is how the smoke test renders real audio.

const VOICES = ['bell', 'marimba', 'pluck', 'synth', 'chiptune'];

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Karplus-Strong plucked string rendered into a buffer. Pure and
// deterministic (seeded), so Node tests can assert on the samples.
function renderPluck(freq, sampleRate, seconds = 1.2, seed = 7, damp = 0.996) {
  const n = Math.floor(seconds * sampleRate);
  const period = Math.max(2, Math.round(sampleRate / freq));
  const rand = mulberry32(seed);
  const ring = new Float32Array(period);
  for (let i = 0; i < period; i++) ring[i] = rand() * 2 - 1;
  const out = new Float32Array(n);
  let i = 0;
  for (let s = 0; s < n; s++) {
    const cur = ring[i];
    out[s] = cur;
    const next = ring[(i + 1) % period];
    ring[i] = damp * 0.5 * (cur + next);
    i = (i + 1) % period;
  }
  return out;
}

function envGain(ctx, dest, when, peak, attack, decay) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), when + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
  g.connect(dest);
  return g;
}

function osc(ctx, type, freq) {
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.value = freq;
  return o;
}

function scheduleVoice(ctx, dest, name, freq, when = ctx.currentTime, velocity = 1) {
  const v = Math.max(0, Math.min(1, velocity));
  switch (name) {
    case 'bell': {
      // Inharmonic partials, long decay.
      const partials = [[1, 0.5, 3.2], [2.76, 0.28, 1.8], [5.404, 0.12, 0.8]];
      for (const [ratio, amp, decay] of partials) {
        const g = envGain(ctx, dest, when, amp * v, 0.004, decay);
        const o = osc(ctx, 'sine', freq * ratio);
        o.connect(g);
        o.start(when);
        o.stop(when + decay + 0.1);
      }
      return when + 3.3;
    }
    case 'marimba': {
      const g = envGain(ctx, dest, when, 0.6 * v, 0.003, 0.55);
      const o = osc(ctx, 'sine', freq);
      o.connect(g); o.start(when); o.stop(when + 0.7);
      const g2 = envGain(ctx, dest, when, 0.18 * v, 0.003, 0.12);
      const o2 = osc(ctx, 'sine', freq * 4.2);
      o2.connect(g2); o2.start(when); o2.stop(when + 0.25);
      return when + 0.8;
    }
    case 'pluck': {
      const len = 1.2;
      const buf = ctx.createBuffer(1, Math.floor(len * ctx.sampleRate), ctx.sampleRate);
      buf.getChannelData(0).set(renderPluck(freq, ctx.sampleRate, len));
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.value = 0.9 * v;
      src.connect(g); g.connect(dest);
      src.start(when); src.stop(when + len);
      return when + len;
    }
    case 'synth': {
      const o = osc(ctx, 'sawtooth', freq);
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.Q.value = 1;
      f.frequency.setValueAtTime(Math.min(8000, freq * 6), when);
      f.frequency.exponentialRampToValueAtTime(Math.max(120, freq * 1.5), when + 0.6);
      const g = envGain(ctx, dest, when, 0.4 * v, 0.01, 0.85);
      o.connect(f); f.connect(g);
      o.start(when); o.stop(when + 1.0);
      return when + 1.0;
    }
    case 'chiptune': {
      const o = osc(ctx, 'square', freq);
      o.frequency.setValueAtTime(freq, when);
      o.frequency.setValueAtTime(freq * 1.5, when + 0.05);
      o.frequency.setValueAtTime(freq * 2, when + 0.1);
      const g = envGain(ctx, dest, when, 0.25 * v, 0.002, 0.24);
      o.connect(g);
      o.start(when); o.stop(when + 0.32);
      return when + 0.35;
    }
    default:
      throw new Error(`unknown voice: ${name}`);
  }
}

// Live output: voices -> master gain -> limiter-ish compressor -> out.
function createAudio({ volume = 0.6 } = {}) {
  const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!AC) throw new Error('Web Audio is not available in this browser');
  const ctx = new AC();
  const master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -6;
  comp.knee.value = 6;
  comp.ratio.value = 12;
  comp.attack.value = 0.003;
  comp.release.value = 0.25;
  master.connect(comp);
  comp.connect(ctx.destination);

  let muted = false;
  let vol = Math.max(0, Math.min(1, volume));
  let active = 0;
  master.gain.value = muted ? 0 : vol;

  return {
    ctx,
    destination: master,
    post: comp,
    play(name, freq, velocity = 1) {
      if (ctx.state !== 'running' || muted || active >= 24) return false;
      active += 1;
      setTimeout(() => { active -= 1; }, 1500);
      scheduleVoice(ctx, master, name, freq, ctx.currentTime, velocity);
      return true;
    },
    setVolume(v) {
      vol = Math.max(0, Math.min(1, v));
      if (!muted) master.gain.setTargetAtTime(vol, ctx.currentTime, 0.02);
    },
    setMuted(m) {
      muted = !!m;
      master.gain.setTargetAtTime(muted ? 0 : vol, ctx.currentTime, 0.02);
    },
    isMuted: () => muted,
    getVolume: () => vol,
    resume: () => ctx.resume(),
    suspend: () => ctx.suspend(),
  };
}


// ---- main.js ----
// Ricochet: a tiny browser instrument.
// Bounce mode: balls bounce inside a polygon; each wall hit plays a note.
// Grid mode: drag across a 10x10 field of dots to play.
// Sound is made here; plug the device into a mixer (e.g. EP-136 input).





const params = new URLSearchParams(location.search);
const SMOKE = params.has('smoke');
const SHOT = params.get('shot'); // 'bounce' | 'grid' for deterministic screenshots

const GRID_COLS = 10;
const GRID_ROWS = 10;
const BALL_COLORS = ['#ff3b30', '#f2f2f2', '#8e8e93'];
const BG = '#050505';

const canvas = document.getElementById('stage');
const c2d = canvas.getContext('2d');
const hud = document.getElementById('hud');
const controls = document.getElementById('controls');
const overlay = document.getElementById('overlay');

const app = {
  mode: 'bounce',
  sound: 'bell',
  scale: 'pentatonic',
  rootMidi: 60,
  paused: false,
  audio: null,
  bounce: null,
  corners: 7,
  speed: 23,
  amount: 1,
  flashes: new Map(), // edge index -> intensity 0..1
  grid: {
    sensitivity: 90,
    size: 1,
    tracker: makeTouchTracker(90),
    active: new Map(), // "col,row" -> timestamp
    pointerDown: false,
  },
  triggeredInSmoke: 0,
  hitCount: 0,
};

// ---------- layout ----------

function viewSize() {
  return { w: window.innerWidth, h: window.innerHeight };
}

function resize() {
  const { w, h } = viewSize();
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = `${w}px`;
  canvas.style.height = `${h}px`;
  c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!app.bounce) {
    app.bounce = createBounceState({
      width: w, height: h,
      sides: app.corners, speed: app.speed, amount: app.amount,
      scale: app.scale, rootMidi: app.rootMidi,
    });
  } else {
    app.bounce.width = w;
    app.bounce.height = h;
    rebuildPolygon(app.bounce);
  }
}

function gridRect() {
  const { w, h } = viewSize();
  const side = Math.min(w, h * 0.62) * 0.86;
  return { x: (w - side) / 2, y: h * 0.1, size: side };
}

// ---------- sound ----------

function play(freq, velocity = 1) {
  if (app.audio) app.audio.play(app.sound, freq, velocity);
}

// ---------- grid input ----------

function gridTriggerAt(x, y) {
  const g = gridRect();
  const cell = cellFromPoint(x - g.x, y - g.y, g.size, g.size, GRID_COLS, GRID_ROWS);
  if (!cell) return 0;
  const cells = brushCells(cell, app.grid.size, GRID_COLS, GRID_ROWS);
  const now = performance.now();
  let n = 0;
  for (const c of cells) {
    const key = `${c.col},${c.row}`;
    const last = app.grid.active.get(key);
    if (last && now - last < 120) continue; // don't retrigger a still-lit cell
    if (!app.grid.tracker.allow(x, y)) continue;
    const vel = 1 - 0.25 * (Math.abs(c.col - cell.col) + Math.abs(c.row - cell.row));
    play(gridFreq(app.rootMidi, app.scale, c.row, GRID_ROWS), Math.max(0.4, vel));
    app.grid.active.set(key, now);
    n += 1;
  }
  if (SMOKE) app.triggeredInSmoke += n;
  return n;
}

// ---------- controls ----------

function pill(label, active, onTap) {
  const b = document.createElement('button');
  b.className = `pill${active ? ' active' : ''}`;
  b.textContent = label;
  b.addEventListener('click', () => onTap(b));
  return b;
}

function stepper(label, get, set, step, lo, hi) {
  const wrap = document.createElement('div');
  wrap.className = 'stepper';
  const name = document.createElement('span');
  name.className = 'label';
  name.textContent = label;
  const minus = document.createElement('button');
  minus.textContent = '−';
  const value = document.createElement('span');
  value.className = 'value';
  value.textContent = get();
  const plus = document.createElement('button');
  plus.textContent = '+';
  const update = (d) => {
    const v = Math.min(hi, Math.max(lo, get() + d));
    set(v);
    value.textContent = get();
  };
  minus.addEventListener('click', () => update(-step));
  plus.addEventListener('click', () => update(step));
  wrap.append(name, minus, value, plus);
  return wrap;
}

function buildControls() {
  const shared = document.getElementById('shared-rows');

  const soundRow = document.createElement('div');
  soundRow.className = 'row';
  const soundButtons = new Map();
  for (const v of VOICES) {
    const b = pill(v, v === app.sound, () => {
      app.sound = v;
      for (const [name, btn] of soundButtons) btn.classList.toggle('active', name === v);
      if (app.audio) play(660); // audition the voice
    });
    soundButtons.set(v, b);
    soundRow.append(b);
  }

  const scaleRow = document.createElement('div');
  scaleRow.className = 'row';
  const scaleButtons = new Map();
  for (const s of SCALE_NAMES) {
    const b = pill(s, s === app.scale, () => {
      app.scale = s;
      app.bounce.scale = s;
      for (const [name, btn] of scaleButtons) btn.classList.toggle('active', name === s);
    });
    scaleButtons.set(s, b);
    scaleRow.append(b);
  }
  shared.append(soundRow, scaleRow);

  const bouncePanel = document.getElementById('panel-bounce');
  const bounceSteppers = document.createElement('div');
  bounceSteppers.className = 'steppers';
  bounceSteppers.append(
    stepper('corners', () => app.corners, (v) => { app.corners = v; setCorners(app.bounce, v); }, 1, ...LIMITS.corners),
    stepper('speed', () => app.speed, (v) => { app.speed = v; setSpeed(app.bounce, v); }, 1, ...LIMITS.speed),
    stepper('amount', () => app.amount, (v) => { app.amount = v; setAmount(app.bounce, v); }, 1, ...LIMITS.amount),
  );
  bouncePanel.append(bounceSteppers);

  const gridPanel = document.getElementById('panel-grid');
  const gridSteppers = document.createElement('div');
  gridSteppers.className = 'steppers';
  gridSteppers.append(
    stepper('sensitivity', () => app.grid.sensitivity,
      (v) => { app.grid.sensitivity = v; app.grid.tracker.setSensitivity(v); }, 5, 0, 100),
    stepper('size', () => app.grid.size, (v) => { app.grid.size = v; }, 1, 1, 3),
  );
  gridPanel.append(gridSteppers);
}

function switchMode(mode) {
  app.mode = mode;
  document.querySelectorAll('#mode-dots .dot').forEach((d) => {
    d.classList.toggle('active', d.dataset.mode === mode);
  });
  document.getElementById('panel-bounce').hidden = mode !== 'bounce';
  document.getElementById('panel-grid').hidden = mode !== 'grid';
}

// ---------- rendering ----------

let lastT = 0;
window.__frames = 0;

function frame(t) {
  window.__frames += 1;
  const dt = Math.min(1 / 30, lastT ? (t - lastT) / 1000 : 1 / 60);
  lastT = t;
  const { w, h } = viewSize();
  c2d.fillStyle = BG;
  c2d.fillRect(0, 0, w, h);

  if (app.mode === 'bounce') {
    if (!app.paused) {
      for (const ev of bounceStep(app.bounce, dt)) {
        app.flashes.set(ev.edge, 1);
        app.hitCount += 1;
        play(ev.freq, 0.9);
      }
    }
    drawBounce(dt);
  } else {
    drawGrid(t);
  }
  requestAnimationFrame(frame);
}

function drawBounce(dt) {
  const { polygon, balls } = app.bounce;
  const { vertices, edges } = polygon;

  c2d.lineWidth = 1.5;
  for (let i = 0; i < vertices.length; i++) {
    const a = vertices[i];
    const b = vertices[(i + 1) % vertices.length];
    const f = app.flashes.get(i) || 0;
    c2d.strokeStyle = f > 0.02
      ? `rgba(255, 59, 48, ${0.25 + 0.75 * f})`
      : 'rgba(242, 242, 242, 0.8)';
    c2d.lineWidth = f > 0.02 ? 2.5 : 1.5;
    c2d.beginPath();
    c2d.moveTo(a.x, a.y);
    c2d.lineTo(b.x, b.y);
    c2d.stroke();
    if (f > 0) app.flashes.set(i, f * Math.exp(-dt * 5));
  }

  balls.forEach((ball, i) => {
    c2d.beginPath();
    c2d.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    c2d.fillStyle = BALL_COLORS[i % BALL_COLORS.length];
    c2d.shadowColor = BALL_COLORS[i % BALL_COLORS.length];
    c2d.shadowBlur = 14;
    c2d.fill();
    c2d.shadowBlur = 0;
  });
}

function drawGrid(now) {
  const g = gridRect();
  const cell = g.size / GRID_COLS;
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const cx = g.x + (col + 0.5) * cell;
      const cy = g.y + (row + 0.5) * cell;
      const key = `${col},${row}`;
      const t = app.grid.active.get(key);
      const age = t ? (now - t) / 600 : Infinity;
      if (age < 1) {
        const k = 1 - age;
        c2d.beginPath();
        c2d.arc(cx, cy, cell * 0.16 + cell * 0.22 * k, 0, Math.PI * 2);
        c2d.fillStyle = `rgba(255, 59, 48, ${0.25 + 0.75 * k})`;
        c2d.fill();
      } else {
        if (t) app.grid.active.delete(key);
        c2d.beginPath();
        c2d.arc(cx, cy, 2.2, 0, Math.PI * 2);
        c2d.fillStyle = 'rgba(242, 242, 242, 0.5)';
        c2d.fill();
      }
    }
  }
}

// ---------- input ----------

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let swipeStart = null;

canvas.addEventListener('pointerdown', (e) => {
  if (!app.audio) return;
  app.audio.resume(); // iOS may have suspended the context
  const p = canvasPoint(e);
  if (app.mode === 'grid') {
    app.grid.pointerDown = true;
    app.grid.tracker.reset();
    gridTriggerAt(p.x, p.y);
  } else {
    swipeStart = p;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (app.mode === 'grid' && app.grid.pointerDown) {
    const p = canvasPoint(e);
    gridTriggerAt(p.x, p.y);
  }
});

canvas.addEventListener('pointerup', (e) => {
  if (app.mode === 'grid') {
    app.grid.pointerDown = false;
    app.grid.tracker.reset();
    return;
  }
  if (swipeStart) {
    const p = canvasPoint(e);
    if (Math.abs(p.x - swipeStart.x) > 70) switchMode(p.x < swipeStart.x ? 'grid' : 'bounce');
    swipeStart = null;
  }
});

document.getElementById('btn-pause').addEventListener('click', (e) => {
  app.paused = !app.paused;
  e.currentTarget.innerHTML = app.paused ? '&#9654;' : '&#10074;&#10074;';
  e.currentTarget.classList.toggle('off', app.paused);
});

document.getElementById('btn-mute').addEventListener('click', (e) => {
  if (!app.audio) return;
  app.audio.setMuted(!app.audio.isMuted());
  e.currentTarget.classList.toggle('off', app.audio.isMuted());
});

document.querySelectorAll('#mode-dots .dot').forEach((d) => {
  d.addEventListener('click', () => switchMode(d.dataset.mode));
});

document.addEventListener('visibilitychange', () => {
  if (!app.audio) return;
  if (document.hidden) app.audio.suspend();
  else app.audio.resume();
});

// ---------- startup ----------

function showUI() {
  overlay.hidden = true;
  hud.hidden = false;
  controls.hidden = false;
}

function start(withAudio) {
  if (withAudio && !app.audio) {
    app.audio = createAudio({ volume: 0.6 });
    app.audio.resume();
  }
  showUI();
}

document.getElementById('btn-start').addEventListener('click', () => start(true));

window.__RIC = app;
resize();
buildControls();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);

// ---------- headless hooks (used by scripts/smoke.mjs and shots) ----------

if (SHOT) {
  start(false); // visuals only, no audio context
  if (SHOT === 'grid') {
    switchMode('grid');
    app.grid.sensitivity = 0;
    app.grid.tracker.setSensitivity(0);
    // Trace a deterministic stroke repeatedly so any capture moment
    // shows freshly lit cells (they fade after 600ms).
    const stroke = () => {
      const g = gridRect();
      for (let i = 0; i < 7; i++) {
        gridTriggerAt(g.x + (2 + i) * (g.size / GRID_COLS), g.y + (3 + i) * (g.size / GRID_ROWS));
      }
      gridTriggerAt(g.x + 5 * (g.size / GRID_COLS), g.y + 2 * (g.size / GRID_ROWS));
    };
    stroke();
    setInterval(stroke, 400);
  }
}

async function runSmoke() {
  const results = [];
  const ok = (name, cond, detail = '') => results.push({ name, pass: !!cond, detail });
  try {
    // 1. Engine: 10 simulated seconds with 3 balls must produce clean hits.
    const sim = createBounceState({ width: 390, height: 700, sides: 7, speed: 23, amount: 3 });
    let hits = 0;
    let freqOk = true;
    for (let i = 0; i < 600; i++) {
      for (const ev of bounceStep(sim, 1 / 60)) {
        hits += 1;
        if (!Number.isFinite(ev.freq) || ev.freq <= 0) freqOk = false;
      }
    }
    ok('bounce engine produces wall hits', hits > 10, `${hits} hits in 10 simulated s`);
    ok('hit frequencies are finite and positive', freqOk);

    // 2. Real start: audio context, safe defaults, mute behavior.
    start(true);
    await app.audio.resume();
    ok('audio context running after start', app.audio.ctx.state === 'running', app.audio.ctx.state);
    ok('default master volume is safe', app.audio.getVolume() <= 0.85, `volume ${app.audio.getVolume()}`);
    app.audio.setMuted(true);
    ok('mute blocks notes', app.audio.play('bell', 440) === false);
    app.audio.setMuted(false);
    ok('unmute allows notes', app.audio.play('bell', 440) === true);

    // 3. Voices: play each through the live chain and measure real output
    //    on an analyser tap (headless Chrome renders to a null sink; the
    //    analyser still sees the signal).
    const analyser = app.audio.ctx.createAnalyser();
    analyser.fftSize = 2048;
    app.audio.post.connect(analyser); // measure after the limiter
    const buf = new Float32Array(analyser.fftSize);
    const currentPeak = () => {
      analyser.getFloatTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
      return peak;
    };
    const waitQuiet = async () => {
      for (let k = 0; k < 150; k++) {
        await new Promise((r) => setTimeout(r, 60));
        if (currentPeak() < 0.02) return;
      }
    };
    const measurePeak = async (ms) => {
      let peak = 0;
      for (let t = 0; t < ms; t += 30) {
        await new Promise((r) => setTimeout(r, 30));
        peak = Math.max(peak, currentPeak());
      }
      return peak;
    };
    for (const v of VOICES) {
      await waitQuiet(); // let the previous voice decay so peaks stay comparable
      app.sound = v;
      play(440, 1);
      const peak = await measurePeak(500);
      ok(`voice "${v}" produces audible, limited output`, peak > 0.005 && peak <= 1.3, `peak ${peak.toFixed(3)}`);
    }
    app.sound = 'bell';

    // 4. Grid: synthetic pointer drag must trigger notes.
    switchMode('grid');
    const r = canvas.getBoundingClientRect();
    const fire = (type, fx, fy) => canvas.dispatchEvent(new PointerEvent(type, {
      clientX: r.left + r.width * fx, clientY: r.top + r.height * fy, bubbles: true,
    }));
    fire('pointerdown', 0.2, 0.25);
    for (let i = 1; i <= 20; i++) fire('pointermove', 0.2 + i * 0.03, 0.25 + i * 0.02);
    fire('pointerup', 0.8, 0.65);
    ok('grid drag triggers notes', app.triggeredInSmoke > 0, `${app.triggeredInSmoke} notes`);

    // 5. Bounce: the live loop must keep producing wall hits.
    switchMode('bounce');
    const frames = (n) => new Promise((res) => {
      let left = n;
      const tick = () => (--left <= 0 ? res() : requestAnimationFrame(tick));
      requestAnimationFrame(tick);
    });
    const before = app.hitCount;
    await frames(150); // 2.5s of animation frames, independent of wall clock
    ok('live bounce loop keeps playing', app.hitCount > before, `${app.hitCount - before} hits`);
  } catch (err) {
    results.push({ name: 'smoke run completed', pass: false, detail: String((err && err.stack) || err) });
  }
  const pass = results.every((x) => x.pass);
  const pre = document.createElement('pre');
  pre.id = 'smoke';
  pre.textContent = JSON.stringify({ pass, results }, null, 2);
  document.body.appendChild(pre);
  document.title = pass ? 'SMOKE PASS' : 'SMOKE FAIL';
  window.__SMOKE = { pass, results };
}

if (SMOKE) runSmoke();


</script>
